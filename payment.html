<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ankara Jersey - About</title>
<link rel="icon" type="image/png" href="logo-removebg-preview.png">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: #111;
        color: white;
        overflow-x: hidden;
    }

    /* Navigation Bar */
    nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #000;
        padding: 10px 20px;
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 2px solid #444;
    }

    nav .logo-container {
        display: flex;
        align-items: center;
    }

    nav .logo-container img {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid white;
        margin-right: 10px;
        background: white;
    }

    nav .logo-container span {
        font-family: 'Great Vibes', cursive;
        font-weight: bold;
        font-size: 28px;
        color: white;
    }

    nav ul {
        display: flex;
        list-style: none;
        margin: 0;
        padding: 0;
        align-items: center;
    }

    nav ul li {
        margin-left: 20px;
        position: relative;
    }

    nav ul li a {
        color: white;
        text-decoration: none;
        font-weight: bold;
        transition: color 0.3s;
    }

    nav ul li a:hover {
        color: grey;
    }

    /* QR Section */
    .qr-section {
        text-align: center;
        margin-top: 60px;
        padding: 30px;
    }

    .qr-section h2 {
        margin-bottom: 15px;
        font-size: 22px;
        color: #f5f5f5;
    }

    .qr-placeholder {
        width: 250px;
        height: 250px;
        margin: 20px auto;
        border: 2px dashed white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        color: #aaa;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
    }

    .qr-note {
        margin-top: 20px;
        font-size: 18px;
        line-height: 1.6;
    }

    .highlight {
        color: #00ffcc;
        font-weight: bold;
    }
</style>
</head>
<body>
    <!-- Navbar -->
    <nav>
        <div class="logo-container">
            <img src="logo.jpg" alt="Logo">
            <span>Ankara Jersey</span>
        </div>
        <ul>
            <li><a href="jursey-home.html">Home</a></li>
            <li><a href="jursey-login.html">Login</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
    </nav>

    <!-- QR Code Payment Section -->
    <div class="qr-section">
        <h2>Complete Your Payment</h2>
    
        <div class="qr-placeholder">
    <img src="your-qr-code.png" alt="QR Code" width="250" height="250">
</div>
        
        <p class="qr-note">
            Pay on this QR and send SS to <span class="highlight">9867090407</span> <br>
            along with your <span class="highlight">Address</span> on this number <br>
            and you will get your order delivered ✅
        </p>
    </div>
</body>
</html>
